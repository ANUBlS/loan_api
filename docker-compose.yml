# Runs the API only. The database is an external PostgreSQL server;
# set DATABASE_URL in .env, e.g.
#   DATABASE_URL=postgresql+psycopg://USER:PASSWORD@192.168.2.94:5432/webapp
# (the .env file is not committed - keep passwords out of git)
#
# Port 80 on this server -> API (8000 inside the container).
# The firewall forwards smartfinance.az:42420 -> 192.168.2.93:80.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:8000"
