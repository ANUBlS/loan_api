services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webuser
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: webapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_api"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://webuser:123456@192.168.294:5432/webapp
    ports:
      - "42420:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
