name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loan
          POSTGRES_PASSWORD: loan
          POSTGRES_DB: loan_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loan -d loan_api_test"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://loan:loan@localhost:5432/loan_api_test
      TEST_DATABASE_URL: postgresql+psycopg://loan:loan@localhost:5432/loan_api_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Migration must build the same schema the models describe
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - run: pytest -q
